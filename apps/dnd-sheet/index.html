<title>Table Sheet</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap");
:root{
  /* Black and white in every mode. Change the look here only; nothing below hard-codes a colour. */
  --bg:#000000;--surface:#0b0b0b;--surface2:#1c1c1c;--ink:#ffffff;--muted:#b8b8b8;
  --line:#8c8c8c;--hair:#3a3a3a;--accent:#ffffff;--accent-ink:#000000;
  --danger:#ff6b60;--danger-ink:#000000;--warn:#e6e6e6;--warn-ink:#000000;--focus:#ffffff;
  --off:#8f8f8f;--off-line:#444444;
  --bar:#141414;--bar-ink:#ffffff;--label-bg:#1f1f1f;--label-ink:#ffffff;
  --head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
#top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink)}
.topin{max-width:640px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.who{flex:1;min-width:0}
.who .nm{display:block;font:700 24px/1.05 var(--head);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .vit{display:block;font:500 14px/1.2 var(--head);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.who .vit b{font-weight:700;font-size:16px}
.tag{display:inline-block;font:700 11px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:3px 5px;background:var(--bar-ink);color:var(--bar);margin-right:6px;vertical-align:2px}
#sw{max-width:44vw;min-height:44px;background:transparent;color:var(--bar-ink);border:1.5px solid var(--bar-ink);border-radius:2px;padding:0 6px}
#sw option{color:var(--ink);background:var(--bg)}
.tbtn{min-height:44px;min-width:44px;background:transparent;color:var(--bar-ink);border:1.5px solid var(--bar-ink);border-radius:2px;font:600 13px var(--head);letter-spacing:.08em;text-transform:uppercase;padding:0 8px}
#note{background:var(--warn);color:var(--warn-ink)}
#note:empty{display:none}
#note .notein{max-width:640px;margin:0 auto;padding:6px 16px;font-size:14px}
#note.bad{background:var(--danger);color:var(--danger-ink)}
#app{max-width:640px;margin:0 auto;padding:0 16px 104px}
.sec{margin:20px 0 0;border:1.5px solid var(--line);background:var(--surface)}
.sec>h2{margin:0;font:600 14px/1 var(--head);letter-spacing:.14em;text-transform:uppercase;background:var(--label-bg);color:var(--label-ink);padding:7px 10px}
.sec>.in{padding:12px}
.sec .in>*+*{margin-top:12px}
.sub{font:600 12px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.hint{font-size:14px;color:var(--muted);margin:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.fld{display:block;min-width:0}
.fld .lab,.lab{display:block;font:600 11px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.fld input,.fld textarea,.fld select,.inp{width:100%;min-height:44px;background:transparent;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:8px 4px;font:500 16px/1.3 var(--body);color:var(--ink)}
.fld textarea{min-height:96px;border:1.5px solid var(--line);padding:8px;resize:vertical;background:var(--surface)}
.fld select{background:var(--surface)}
.btn{min-height:44px;padding:0 14px;font:600 15px var(--head);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:2px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{background:var(--danger);color:var(--danger-ink);border-color:var(--danger)}
.btn.armed{background:var(--warn);color:var(--warn-ink);border-color:var(--warn)}
.btn.sm{min-height:44px;min-width:44px;padding:0 10px}
.btn.wide{width:100%}
.rbar{display:flex;flex-wrap:wrap;gap:4px 6px;margin:0 0 10px}
.rp{padding:3px 7px;border:1px solid var(--line);background:var(--surface);font:600 14px/1.2 var(--head);letter-spacing:.04em;white-space:nowrap}
.rp b{font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.rp.low{color:var(--off);border-color:var(--off-line);border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:var(--surface);border-radius:2px;font:600 14px var(--head);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font:600 13px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
details[open]>summary{color:var(--ink)}
.hprow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hpnum{font:700 76px/0.95 var(--head);letter-spacing:-.01em}
.hpnum small{font-size:36px;font-weight:600;color:var(--muted)}
.hptemp{font:700 22px var(--head);color:var(--ink);padding-bottom:6px}
.bar{height:12px;border:1.5px solid var(--line);background:var(--surface2)}
.bar>i{display:block;height:100%;width:0;background:var(--accent)}
.bar.low>i{background:var(--danger)}
.msg{min-height:22px;font-size:15px}
.ab-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 12px;padding-bottom:14px}
.ab{border:1.5px solid var(--line);background:var(--surface);text-align:center;padding:8px 2px 0;position:relative;margin-bottom:12px}
.ab .nm{font:600 12px/1 var(--head);letter-spacing:.14em;text-transform:uppercase}
.ab .mod{display:block;font:700 42px/1.05 var(--head);margin:2px 0 14px}
.ab input{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);width:58px;min-height:34px;height:34px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);text-align:center;font:600 19px var(--head);padding:0}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cell{border:1.5px solid var(--line);background:var(--surface);padding:6px 6px 4px;text-align:center;min-width:0}
.cell .v{display:block;font:700 30px/1.1 var(--head)}
.cell input{border:0;background:transparent;width:100%;text-align:center;font:700 30px/1.1 var(--head);min-height:40px;padding:0}
.cell .lab{margin:0}
.line{display:flex;align-items:center;gap:6px;min-height:44px;border-bottom:1px solid var(--hair)}
.line .tot{width:44px;text-align:center;font:700 20px var(--head);border:1.5px solid var(--line);padding:2px 0;flex:none}
.line .ln{flex:1;min-width:0}
.line .ab3{font:600 12px var(--head);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.dot,.pip{width:44px;height:44px;background:none;border:0;padding:0;position:relative;flex:none;cursor:pointer}
.dot::before{content:"";position:absolute;left:14px;top:14px;width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dot.p1::before{background:var(--ink)}
.dot.p2::before{background:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.pip::before{content:"";position:absolute;inset:9px;border:2px solid var(--line);border-radius:50%}
.pip.sq::before{border-radius:3px}
.pip.on::before{background:var(--accent);border-color:var(--accent)}
.pip.f.on::before{background:var(--danger);border-color:var(--danger)}
.pips{display:flex;flex-wrap:wrap;align-items:center}
.slotrow{display:flex;align-items:center;gap:8px;min-height:48px;border-bottom:1px solid var(--hair)}
.slotrow .lv{width:44px;font:700 20px var(--head)}
.qty{display:flex;align-items:center;gap:6px}
.qty .n{min-width:44px;text-align:center;font:700 26px var(--head)}
.item{border-bottom:1px solid var(--hair);padding:6px 0}
.exb{margin-top:16px;border:1.5px dashed var(--warn);padding:10px 12px;background:var(--surface)}
.exb b{font-family:var(--head);letter-spacing:.06em;text-transform:uppercase}
.exb .row{margin-top:8px}
.big{font:700 28px/1 var(--head)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv dt{font:600 12px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0;overflow-wrap:anywhere}
.warnbox{border-left:4px solid var(--warn);padding:4px 10px;font-size:14px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
#tabs button{min-height:56px;border:0;border-right:1px solid var(--hair);background:transparent;font:600 16px var(--head);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:0 2px}
#tabs button:last-child{border-right:0}
#tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.turnbar{margin-top:12px;padding:8px 0 0}
.turnbar .row{flex-wrap:nowrap}
.mps{display:flex;gap:4px;margin-left:auto}
.mp{min-height:44px;min-width:44px;padding:0 6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:2px;font:600 12px var(--head);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.mp[aria-pressed="true"]{background:var(--surface2);color:var(--off);border-color:var(--off-line);text-decoration:line-through}
.ed{font:600 12px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.st{display:inline-block;font:700 12px/1 var(--head);letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--ink);padding:4px 6px;margin:6px 6px 0 0}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}
.acell{position:relative;min-width:0}
.abtn{width:100%;min-height:60px;text-align:left;padding:7px 46px 7px 10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:2px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.abtn b{font:600 16px/1.1 var(--head);letter-spacing:.05em;text-transform:uppercase}
.abtn small{font:500 13px/1.25 var(--body);color:var(--muted)}
.abtn.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.abtn.sel small{color:var(--accent-ink);font-weight:600}
.abtn.next{border-color:var(--ink);border-width:3px}
.abtn:disabled{border-color:var(--off-line);background:transparent;cursor:default}
.abtn:disabled b,.abtn:disabled small{color:var(--off)}
.ibtn{position:absolute;top:4px;right:4px;width:40px;height:40px;border:1.5px solid var(--line);border-radius:50%;background:transparent;color:var(--ink);font:italic 700 17px var(--body);cursor:pointer;padding:0}
.acell.sel .ibtn{border-color:var(--accent-ink);color:var(--accent-ink)}
.sub2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--surface2);border:1.5px solid var(--accent);border-top:0}
.mk{display:flex;align-items:center;gap:4px}
.mini{min-height:44px;padding:0 10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:2px;font:600 13px var(--head);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tlog{margin:8px 0 0;padding-left:28px;font-size:14px}
.tlog li{margin-bottom:4px}
.lvl-lines{margin:6px 0 10px;padding-left:20px;font-size:14px}
.lvl-lines li{margin-bottom:3px}
/* i-button rules box (Oct 31 fix): it used the two-column .kv grid inside a half-width action cell, so a long label
   ("Damage / effect") took the width and the text was squeezed to a letter or two per line. Now the open cell spans the
   whole row and each label sits above its text. */
.acell.open{grid-column:1/-1}
.infop{display:block;margin:6px 0 0;padding:8px 10px;border:1.5px solid var(--line);background:var(--surface);max-width:100%;overflow:hidden}
.infop dt{font:600 12px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:8px 0 1px}
.infop dt:first-child{margin-top:0}
.infop dd{margin:0;font:400 15px/1.35 var(--body);color:var(--ink);white-space:pre-line;overflow-wrap:break-word;word-break:normal}
@media (prefers-reduced-motion: no-preference){
  .btn,.chip,.pip::before,.dot::before{transition:background-color .15s,border-color .15s}
  .bar>i{transition:width .3s}
}
@media (max-width:360px){.hpnum{font-size:64px}.ab .mod{font-size:36px}}
</style>

<script id="pure-logic">
/* ===== PURE-START: no DOM, no network. Tested by tests/pure.test.js ===== */
var ABILS = ["str", "dex", "con", "int", "wis", "cha"];
var ABIL_NAMES = { str: "Strength", dex: "Dexterity", con: "Constitution", int: "Intelligence", wis: "Wisdom", cha: "Charisma" };
var SKILLS = [
  ["acrobatics", "Acrobatics", "dex"], ["animalHandling", "Animal Handling", "wis"], ["arcana", "Arcana", "int"],
  ["athletics", "Athletics", "str"], ["deception", "Deception", "cha"], ["history", "History", "int"],
  ["insight", "Insight", "wis"], ["intimidation", "Intimidation", "cha"], ["investigation", "Investigation", "int"],
  ["medicine", "Medicine", "wis"], ["nature", "Nature", "int"], ["perception", "Perception", "wis"],
  ["performance", "Performance", "cha"], ["persuasion", "Persuasion", "cha"], ["religion", "Religion", "int"],
  ["sleightOfHand", "Sleight of Hand", "dex"], ["stealth", "Stealth", "dex"], ["survival", "Survival", "wis"]
];
var SKILL_MAP = {};
SKILLS.forEach(function (s) { SKILL_MAP[s[0]] = { label: s[1], ab: s[2] }; });
var CONDITIONS = ["Blinded", "Charmed", "Deafened", "Frightened", "Grappled", "Incapacitated", "Invisible", "Paralyzed", "Petrified", "Poisoned", "Prone", "Restrained", "Stunned", "Unconscious"];
var EXHAUSTION_EFFECTS = ["No exhaustion", "Disadvantage on ability checks", "Speed halved", "Disadvantage on attack rolls and saving throws", "Hit point maximum halved", "Speed reduced to 0", "Death"];

function toInt(v, d) {
  if (typeof v === "number") return isFinite(v) ? Math.trunc(v) : d;
  var n = parseInt(String(v == null ? "" : v).replace(/−/g, "-").trim(), 10);
  return isNaN(n) ? d : n;
}
function clamp(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function fmtSigned(n) { return (n >= 0 ? "+" : "−") + Math.abs(n); }
function ordinal(n) { return n + (n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th"); }

function abilityMod(score) { return Math.floor((toInt(score, 10) - 10) / 2); }
function profBonus(level) { return 2 + Math.floor((clamp(toInt(level, 1), 1, 20) - 1) / 4); }
function saveTotal(ch, ab) { return abilityMod(ch.abilities[ab]) + (ch.saveProf[ab] ? profBonus(ch.level) : 0); }
/* skillProf: 0 none, 1 proficient, 2 expertise (double the proficiency bonus) */
function skillTotal(ch, key) {
  var def = SKILL_MAP[key];
  var p = clamp(toInt(ch.skillProf[key], 0), 0, 2);
  return abilityMod(ch.abilities[def.ab]) + p * profBonus(ch.level);
}
function passivePerception(ch) { return 10 + skillTotal(ch, "perception"); }
function initiative(ch) { return abilityMod(ch.abilities.dex) + toInt(ch.initBonus, 0); }
function spellSaveDC(ch) { return 8 + profBonus(ch.level) + abilityMod(ch.abilities[ch.spellAbility] || 10); }
function spellAttackBonus(ch) { return profBonus(ch.level) + abilityMod(ch.abilities[ch.spellAbility] || 10); }

function blankCharacter() {
  var c = {
    v: 1, kind: "character", name: "", player: "", cls: "", level: 1, race: "", background: "", alignment: "", xp: "",
    abilities: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 },
    saveProf: { str: false, dex: false, con: false, int: false, wis: false, cha: false },
    skillProf: {}, ac: 10, speed: 30, initBonus: 0, inspiration: false,
    hp: { cur: 0, max: 0, temp: 0 }, deathSaves: { s: 0, f: 0 }, hitDice: [],
    spellAbility: "", slots: [], pact: { max: 0, used: 0, level: 1 }, spells: [],
    resources: [], conditions: [], exhaustion: 0, concentration: { on: false, spell: "" },
    attacks: [], attackNotes: "", features: "", proficiencies: "", languages: "", equipment: "",
    items: [], currency: { cp: 0, sp: 0, ep: 0, gp: 0, pp: 0 }, notes: "", personality: "",
    edition: "2024", presetVersion: 0, attacksPerAction: 1, toggles: {}, actions: [], turnLog: [], turnNo: 0,
    subKey: "", hpPerLevel: null, choices: {}, levelUndo: null
  };
  SKILLS.forEach(function (s) { c.skillProf[s[0]] = 0; });
  for (var i = 0; i < 9; i++) c.slots.push({ max: 0, used: 0 });
  return c;
}

/* Soft = typing in a box: keep cur as typed, only floor at 0. Full = clamp cur into 0..max. */
function normalizeHp(ch, soft) {
  var hp = ch.hp;
  hp.max = Math.max(0, toInt(hp.max, 0));
  hp.temp = Math.max(0, toInt(hp.temp, 0));
  hp.cur = Math.max(0, toInt(hp.cur, 0));
  if (!soft && hp.max > 0) hp.cur = Math.min(hp.cur, hp.max);
  if (hp.cur > 0) ch.deathSaves = { s: 0, f: 0 };
  return ch;
}
function setDeathSave(ch, kind, n) {
  var c = clone(ch);
  c.deathSaves[kind === "f" ? "f" : "s"] = clamp(toInt(n, 0), 0, 3);
  return c;
}
/* Damage: temp HP first, then HP, never below 0. Returns a new character. */
function applyDamage(ch, amount) {
  var amt = Math.max(0, toInt(amount, 0));
  var c = clone(ch);
  var absorbed = Math.min(c.hp.temp, amt);
  c.hp.temp -= absorbed;
  if (c.hp.cur === 0 && amt > 0) c.deathSaves.f = Math.min(3, c.deathSaves.f + 1);
  c.hp.cur = Math.max(0, c.hp.cur - (amt - absorbed));
  return c;
}
function damageInfo(ch, amount) {
  var amt = Math.max(0, toInt(amount, 0));
  var absorbed = Math.min(ch.hp.temp, amt);
  var rest = amt - absorbed;
  var lost = Math.min(ch.hp.cur, rest);
  var overflow = rest - lost;
  return { amount: amt, absorbed: absorbed, lost: lost, overflow: overflow,
    massive: ch.hp.max > 0 && overflow >= ch.hp.max, concDC: Math.max(10, Math.floor(amt / 2)) };
}
/* Healing caps at max HP; any HP above 0 resets the death saves. */
function applyHeal(ch, amount) {
  var amt = Math.max(0, toInt(amount, 0));
  var c = clone(ch);
  c.hp.cur = c.hp.max > 0 ? Math.min(c.hp.max, c.hp.cur + amt) : c.hp.cur + amt;
  if (c.hp.cur > 0) c.deathSaves = { s: 0, f: 0 };
  return c;
}
/* Temp HP does not stack: keep the higher number. */
function applyTempHp(ch, amount) {
  var c = clone(ch);
  c.hp.temp = Math.max(c.hp.temp, Math.max(0, toInt(amount, 0)));
  return c;
}

function spendSlot(ch, lvl) {
  var c = clone(ch), s = c.slots[lvl - 1];
  if (s && s.used < s.max) s.used += 1;
  return c;
}
function restoreSlot(ch, lvl) {
  var c = clone(ch), s = c.slots[lvl - 1];
  if (s && s.used > 0) s.used -= 1;
  return c;
}
function spendPact(ch) { var c = clone(ch); if (c.pact.used < c.pact.max) c.pact.used += 1; return c; }
function restorePact(ch) { var c = clone(ch); if (c.pact.used > 0) c.pact.used -= 1; return c; }

/* Exhaustion text by edition. 2024: each level is -2 on every d20 Test and -5 ft speed; level 6 is death. 2014: the six-step table. */
function exhaustionText(c) {
  var n = clamp(toInt(c.exhaustion, 0), 0, 6);
  if (!n) return EXHAUSTION_EFFECTS[0];
  if (c.edition !== "2014") return n >= 6 ? "Level 6: death" : "Level " + n + ": -" + (2 * n) + " on every d20 Test, speed -" + (5 * n) + " ft";
  return "Level " + n + ": " + EXHAUSTION_EFFECTS[n] + " (and the levels before it)";
}
/* Short rest: short-rest resources and pact slots come back. HP, other slots and hit dice do not. */
function shortRest(ch) {
  var c = clone(ch);
  c.pact.used = 0;
  c.resources.forEach(function (r) { if (r.reset === "short") r.used = 0; else if (r.shortBack) r.used = Math.max(0, r.used - r.shortBack); });
  c.toggles = {};
  return c;
}
/* Long rest: full HP, no temp HP, all slots, all resources, hit dice (2024: all, 2014: half, at least 1),
   death saves and concentration cleared, exhaustion down by 1. */
function longRest(ch) {
  var c = clone(ch);
  c.hp.cur = c.hp.max;

      if (String(L.hp).trim() !== "") picks.hpRoll = toInt(L.hp, 0);
      if (L.sub) { picks.sub = L.sub === "other" ? "other" : L.sub; picks.subName = L.subName; }
      if (L.asi.mode) picks.asi = { mode: L.asi.mode, a: L.asi.a, b: L.asi.b, name: L.asi.name, ab: L.asi.ab };
      picks.boon = { name: L.boon.name, ab: L.boon.ab };
      if (!picks.boon.name.trim()) delete picks.boon;
      picks.cantrips = L.cant.slice(); picks.spells = L.sp.map(function (s) { return { name: s.name, level: s.level }; });
      var r = levelUp(C(), picks);
      if (!r.ok) { L.msg = r.msg; render(); return; }
      lvApply(r);
    },
    lvundo: function () {
      var r = levelUndo(C());
      if (!r.ok) { lvState().msg = r.msg; render(); return; }
      replaceCur(r.ch); S.turns[S.cur] = newTurnFor(r.ch); S.lv = null; S.actmsg = r.msg; commit();
    },
    lvroll: function () {
      var r = levelUpSetRoll(C(), ($("lv-roll") || {}).value);
      if (!r.ok) { lvState().msg = r.msg; render(); return; }
      replaceCur(r.ch); S.lv = null; S.actmsg = r.msg; commit();
    },
    rest: function () { S.restUi = S.restUi ? null : { step: "ask" }; render(); },
    restpick: function (a) {
      var c = C();
      if (a === "long") {
        var after = longRest(c), sum = restSummary(c, after);
        replaceCur(after); S.turns[S.cur] = newTurnFor(after); S.info = null; S.actmsg = "";
        S.restUi = { step: "done", text: "Long rest done." + (sum.length ? " Back: " + sum.join(", ") + "." : " Nothing needed recharging.") + " Turn log cleared." };
        commit(); return;
      }
      S.restUi = { step: "short", die: null, before: clone(c), msg: "" }; render();
    },
    hdpick: function (a) { if (S.restUi) { S.restUi.die = toInt(a, 0); S.restUi.msg = ""; render(); } },
    hdheal: function (a) {
      var u = S.restUi; if (!u || u.die == null) return;
      var r = spendHitDie(C(), u.die, a === "input" ? ($("f-roll") || {}).value : a);
      if (!r.ok) { u.msg = r.msg + "."; render(); return; }
      replaceCur(r.ch); u.msg = r.msg; u.die = null; commit();
    },
    restdone: function () {
      var u = S.restUi; if (!u || u.step !== "short") return;
      var after = shortRest(C()), sum = restSummary(u.before, after);
      replaceCur(after); S.turns[S.cur] = newTurnFor(after); S.info = null; S.actmsg = "";
      S.restUi = { step: "done", text: "Short rest done." + (sum.length ? " Back: " + sum.join(", ") + "." : " Nothing needed recharging.") };
      commit();
    },
    restclose: function () { S.restUi = null; render(); },
    additem: function () {
      var el = $("f-additem"), r = addItemText(C(), el ? el.value : "");
      if (!r.ok) { S.actmsg = r.msg + "."; render(); return; }
      replaceCur(r.ch); S.actmsg = r.msg; commit();
    },
    act: function (a) {
      var act = actionList(C()).filter(function (x) { return x.id === a; })[0]; if (!act) return;
      apply(tapAction(C(), T(), act, {}), true);
    },
    again: function (a) {
      var act = actionList(C()).filter(function (x) { return x.id === a; })[0]; if (!act) return;
      apply(addUse(C(), T(), act, {}), true);
    },
    mark: function (a) { var p = a.split(":"); apply(setMark(C(), T(), +p[0], +p[1], p[2] === "hit"), false); },
    lvl: function (a) { var p = a.split(":"); apply(setLevel(C(), T(), +p[0], +p[1]), false); },
    info: function (a) { S.info = S.info === a ? null : a; render(); },
    preset: function (a) {
      var p = PRESETS[+a]; if (!p) return;
      if (S.chars.example && !S.exampleTouched) delete S.chars.example;
      addChar(sanitizeCharacter(p)); S.tab = "play"; saveUi(); render(); window.scrollTo(0, 0);
    },
    upconfirm: function () { adopt("replace"); },
    upnew: function () { adopt("new"); },
    updiscard: function () { S.up.preview = null; S.up.status = "Discarded. Nothing changed."; render(); }
  };
  function addChar(ch) {
    var id = newId(); ch.id = id; ch.example = false; S.chars[id] = ch; S.cur = id; S.undo = null; S.msg = "";
    if (!S.prefs.defaultId) { S.prefs.defaultId = id; queueWrite("_prefs"); }
    queueWrite(id);
  }
  function adopt(mode) {
    var p = S.up.preview; if (!p) return;
    var ch = sanitizeCharacter(p.character);
    if (mode === "replace" && !C().example) { ch.id = S.cur; ch.example = false; S.chars[S.cur] = ch; queueWrite(S.cur); }
    else { if (mode === "replace") delete S.chars.example; addChar(ch); }
    S.up.preview = null; S.up.status = "Done. " + (ch.name || "The character") + " is open."; S.undo = null; S.tab = "play"; saveUi(); render(); window.scrollTo(0, 0);
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-act]") : null; if (!b) return;
    var f = ACT[b.getAttribute("data-act")]; if (f) f(b.getAttribute("data-arg") || "");
  });
  function onEdit(e) {
    var t = e.target;
    if (t.id === "sw" && e.type === "change") { ACT.open(t.value); return; }
    if (t.id === "f-upload") { if (e.type === "change" && t.files && t.files[0]) handleFile(t.files[0]); return; }
    var lk = t.getAttribute && t.getAttribute("data-lv");
    if (lk) { lvSet(lk, t.value); return; }
    var p = t.getAttribute && t.getAttribute("data-path"); if (!p) return;
    var k = t.getAttribute("data-t"), v = t.value;
    if (k === "n") v = toInt(v, 0); else if (k === "nl") v = v === "" ? null : toInt(v, 0);
    if (e.type === "input" && t.tagName === "SELECT" && t.getAttribute("data-render")) return;
    setPath(C(), p, v);
    var c = C();
    if (p.indexOf("hp.") === 0) {
      normalizeHp(c, e.type === "input");
      if (e.type === "change") { var f = p.split(".")[1]; if (String(c.hp[f]) !== t.value) t.value = c.hp[f]; }
    }
    if (p === "level") c.level = clamp(toInt(v, 1), 1, 20);
    touch(); refreshCalc();
    if (e.type === "change" && t.getAttribute("data-render")) render();
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target && e.target.id === "f-additem") { e.preventDefault(); ACT.additem(); } });
  document.addEventListener("input", onEdit);
  document.addEventListener("change", onEdit);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flushAll(); });
  window.addEventListener("pagehide", flushAll);

  /* ---------- upload ---------- */
  function setUp(text) { S.up.status = text; var el = $("up-status"); if (el) el.textContent = text; }
  function userFail(msg) { return { user: msg }; }
  function sampleFail(e) {
    var code = e && e.code;
    if (code === "not_granted") return "You said no to sending this to Claude, so I could not read it. You can try again and allow it.";
    if (code === "rate_limited") return "Claude is rate-limited right now. Wait a bit and try again.";
    if (code === "invalid_json") return "Claude's reply could not be read as a sheet. Try a clearer photo or a flatter, brighter scan.";
    if (code === "image_rejected" || code === "images_unavailable") return "That image type or size was not accepted. Try a JPEG or PNG under the size limit.";
    return "Claude could not read this file" + (e && e.message ? " (" + e.message + ")" : "") + ".";
  }
  function showPreview(res, name, how) {
    res.name = name; res.how = how; S.up.preview = res; S.up.busy = false; S.up.status = "";
    S.tab = "roster"; saveUi(); render(); window.scrollTo(0, 0);
  }
  async function askClaude(kind, text, blobs) {
    var opts = { modelTier: "default" }; if (blobs && blobs.length) opts.images = blobs;
    var data = await SAMPLE.json(buildReadPrompt(kind, text), opts);
    return characterFromExtracted(data);
  }
  async function handleFile(file) {
    if (S.up.busy) return;
    S.up.busy = true; S.up.preview = null; setUp("Reading " + file.name + "...");
    try {
      var isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
      if (file.type === "application/json" || /\.json$/i.test(file.name)) { showPreview(characterFromJsonText(await file.text()), file.name, "file"); return; }
      if (isPdf) await readPdf(file); else await readImage(file);
    } catch (e) {
      S.up.busy = false;
      var msg = e && e.user ? e.user : (e && e.message && /not a character sheet|does not look like/.test(e.message) ? e.message : "Something went wrong reading that file" + (e && e.message ? " (" + e.message + ")" : "") + ".");
      setUp(msg);
    }
  }
  async function readImage(file) {
    if (!SAMPLE || !S.up.canImages) throw userFail("Reading photos is not available here, so I can only read PDFs that have form fields. A fillable PDF still works.");
    if (S.up.imgTypes.length && S.up.imgTypes.indexOf(file.type) < 0) throw userFail("That photo type (" + (file.type || "unknown") + ") is not accepted. Use " + S.up.imgTypes.join(", ") + ".");
    if (S.up.imgBytes && file.size > S.up.imgBytes) throw userFail("That photo is too large. The limit is " + Math.round(S.up.imgBytes / 1048576) + " MB.");
    setUp("Sending the photo to Claude to read...");
    var res;
    try { res = await askClaude("images", "", [file]); } catch (e) { throw e && e.user ? e : (e && e.code ? userFail(sampleFail(e)) : e); }
    showPreview(res, file.name, "photo");
  }
  async function readPdf(file) {
    var lib = window.pdfjsLib;
    if (!lib) throw userFail("The PDF reader did not load (it needs an internet connection). Reload and try again, or upload a photo of the sheet instead.");
    try { lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; } catch (e) { }
    var pdf;
    try { pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; }
    catch (e) {
      var wk = e && /worker/i.test(String(e.message || e));
      throw userFail(wk ? "The PDF reader's helper could not start in this browser. Reload and try again, or upload a photo of the sheet instead." : "That PDF could not be opened. It may be damaged or locked.");
    }
    var fields = {}, text = "", pages = Math.min(pdf.numPages, 8), page, i;
    for (i = 1; i <= pages; i++) {
      page = await pdf.getPage(i);
      var anns = await page.getAnnotations();
      anns.forEach(function (a) {
        if (a.subtype !== "Widget" || !a.fieldName) return;
        var v = a.fieldValue; if (Array.isArray(v)) v = v[0]; if (v === null || v === undefined) v = "";
        if (typeof v === "boolean") v = v ? "Yes" : "Off";
        var old = fields[a.fieldName];
        if (old === undefined || ((old === "" || old === "Off") && v !== "" && v !== "Off")) fields[a.fieldName] = String(v);
      });
      try { var tc = await page.getTextContent(); text += tc.items.map(function (it) { return it.str + (it.hasEOL ? "\n" : " "); }).join("") + "\n"; } catch (e) { }
    }
    var res = mapSheetFields(fields);
    if (res.found.length >= 3) { showPreview(res, file.name, "form"); return; }
    if (!SAMPLE) throw userFail("This PDF has no fillable form fields I recognize, and reading flat PDFs or scans is not available here. Use the official fillable 5e sheet, or open this page where Claude is available.");
    var useText = text.replace(/\s+/g, " ").trim().length >= 120, out;
    if (useText) {
      setUp("No form fields found. Sending the sheet's text to Claude to read...");
      try { out = await askClaude("text", text); } catch (e) { throw e && e.user ? e : (e && e.code ? userFail(sampleFail(e)) : e); }
      showPreview(out, file.name, "PDF text"); return;
    }
    if (!S.up.canImages) throw userFail("This PDF looks like a scan and reading images is not available here. A fillable PDF still works.");
    setUp("This PDF is a scan. Rendering its pages for Claude...");
    var blobs = [], n = Math.min(pdf.numPages, S.up.imgMax || 3, 4);
    for (i = 1; i <= n; i++) {
      page = await pdf.getPage(i);
      var vp = page.getViewport({ scale: 1.6 }), cv = document.createElement("canvas");
      cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
      blobs.push(await new Promise(function (ok) { cv.toBlob(ok, "image/jpeg", 0.85); }));
    }
    setUp("Sending the pages to Claude to read...");
    try { out = await askClaude("images", "", blobs); } catch (e) { throw e && e.user ? e : (e && e.code ? userFail(sampleFail(e)) : e); }
    showPreview(out, file.name, "scan");
  }

  /* ---------- capabilities: light up after the first render ---------- */
  async function initCaps() {
    var cl = window.claude, user = null, db = null, uid = null;
    if (cl && typeof cl.use === "function") {
      var got = await Promise.all(["user", "db", "sample"].map(function (n) { return Promise.resolve().then(function () { return cl.use(n); }).catch(function () { return null; }); }));
      user = got[0]; db = got[1]; SAMPLE = got[2];
      if (SAMPLE) {
        S.up.canText = true;
        try { var caps = await SAMPLE.limits(); if (caps && caps.images) { S.up.canImages = true; S.up.imgMax = caps.images.maxCount; S.up.imgTypes = caps.images.mediaTypes || []; S.up.imgBytes = caps.images.maxInputBytes || 0; } } catch (e) { }
      }
      if (user && db) { try { uid = await user.id(); } catch (e) { uid = null; } }
    }
    try {
      if (db && user && uid) { STORE.col = db.collection("data/users/" + uid); S.save.where = "account"; }
      else {
        var ls = deviceStorage(window);   /* no account storage here: keep characters in this browser on this device */
        if (!ls) { setSave("off", "this browser does not let the page keep anything (private browsing, or site storage turned off)."); return; }
        STORE.col = localCollection(ls, LOCAL_PREFIX); S.save.where = "device";
      }
      var snap = await STORE.col.get(), found = {}, prefs = null;
      snap.docs.forEach(function (d) {
        var data = d.data(); if (!data) return;
        if (d.id === "_prefs") prefs = data; else if (data.kind === "character") found[d.id] = data;
      });
      setSave("on");
      if (prefs) S.prefs.defaultId = typeof prefs.defaultId === "string" ? prefs.defaultId : null;
      var ids = Object.keys(found), upgraded = [];
      if (ids.length) {
        ids.forEach(function (id) {
          var c = sanitizeCharacter(found[id]); c.id = id; c.example = false;
          var up = upgradeFromPreset(c, PRESETS);   /* every load: saved characters get newer Ready-made actions */
          S.chars[id] = up.ch;
          W[id] = { timer: null, busy: false, dirty: false, last: up.changed ? null : JSON.stringify(docData(id)), fail: 0 };
          if (up.changed) { upgraded.push(up.ch.name + " (" + up.how + ")"); queueWrite(id); }
        });
        if (upgraded.length) S.actmsg = "Updated from the Ready-made list: " + upgraded.join("; ") + ".";
        if (!S.exampleTouched) {
          delete S.chars.example;
          S.cur = S.chars[S.prefs.defaultId] ? S.prefs.defaultId : orderIds()[0];
        }
      }
    } catch (e) {
      setSave("off", "the storage service refused the connection (" + ((e && e.code) || "error") + ").");
    }
    render();
  }

  /* ---------- go ---------- */
  loadUi(); applyTheme(); render();
  setTimeout(initCaps, 0);
})();
</script>
